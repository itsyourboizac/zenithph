.cover::after{content:"";position:absolute;inset:0;background:linear-gradient(to bottom,transparent 68%,var(--bg))}
.avatar{width:148px;height:148px;margin:-74px auto 0;position:relative;border-radius:50%}
.avatar::before{content:"";position:absolute;inset:-3px;border-radius:50%;background:conic-gradient(#4a4a4a,#fff,#7a7a7a,#fff,#4a4a4a);animation:spin 7s linear infinite}
.avatar img{position:relative;width:100%;height:100%;border-radius:50%;border:4px solid var(--bg);object-fit:cover;display:block}
@keyframes spin{to{transform:rotate(360deg)}}
.head{text-align:center;padding:18px 28px 0}
h1{font-family:Montserrat,system-ui,-apple-system,"Segoe UI",sans-serif;font-size:30px;font-weight:700;line-height:1.15;letter-spacing:-.01em}
.role{margin-top:10px;color:var(--muted);font-size:13.5px;letter-spacing:.01em;text-wrap:balance}
.rule{width:46px;height:2px;margin:18px auto 0;background:#fff;border-radius:2px;transform-origin:center}
/* reveal animations (only when JS runs) */
.js .rise{opacity:0;transform:translateY(16px)}
.js .rise.in{opacity:1;transform:none;transition:opacity .7s ease var(--d,0ms),transform .7s cubic-bezier(.2,.8,.2,1) var(--d,0ms)}
.js .avatar.rise{transform:scale(.6)}
.js .rule.rise{transform:scaleX(0)}
.js .rule.rise.in{transform:none}
/* glass + spotlight */
.glass{background:var(--glass);border:1px solid var(--line);border-radius:16px;position:relative;overflow:hidden}
.glass::before{content:"";position:absolute;inset:0;pointer-events:none;opacity:0;transition:opacity .25s;background:radial-gradient(180px circle at var(--mx,50%) var(--my,50%),rgba(255,255,255,.1),transparent 70%)}
.glass:hover::before{opacity:1}
.qa{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:24px 12px 0}
.qa button,.qa a{box-sizing:border-box;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:8px;padding:16px 6px;font:500 13px Montserrat,system-ui,sans-serif;color:inherit;text-decoration:none;text-align:center;background:var(--glass);border:1px solid var(--line);border-radius:16px;transition:transform .15s}
.qa .glass:active{transform:scale(.96)}
.qa svg{width:26px;height:26px}
.panel{margin:16px 12px 0;padding:18px 10px 10px}
h2{font-family:Montserrat,system-ui,-apple-system,"Segoe UI",sans-serif;font-size:19px;font-weight:700;margin:0 6px 12px}
.row{display:flex;align-items:center;gap:8px;border-radius:12px;position:relative;padding:4px 4px 4px 6px}
.row+.row{margin-top:4px}
.row::before{content:"";position:absolute;inset:0;border-radius:12px;pointer-events:none;opacity:0;transition:opacity .25s;background:radial-gradient(160px circle at var(--mx,50%) var(--my,50%),rgba(255,255,255,.09),transparent 70%)}
.row:hover::before{opacity:1}
.main{display:flex;align-items:center;gap:14px;flex:1;min-width:0;color:inherit;text-decoration:none;padding:8px 0}
.tile{flex:none;width:44px;height:44px;border-radius:13px;display:grid;place-items:center;background:rgba(255,255,255,.08);transition:transform .2s}
.main:hover .tile{transform:scale(1.08) rotate(-3deg)}
.tile svg{width:24px;height:24px}
.txt{min-width:0}
.txt small{display:block;color:var(--muted);font-size:12.5px}
.txt span{font-size:14.5px;font-weight:500;word-break:break-word}
.txt span.sm{font-size:12.5px;letter-spacing:-.01em}
.copy{appearance:none;background:none;border:0;font:inherit;cursor:pointer;flex:none;width:36px;height:38px;border-radius:10px;display:grid;place-items:center;color:var(--muted);position:relative;z-index:1}
.copy:hover{background:rgba(255,255,255,.1);color:#fff}
.copy svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.social{display:flex;align-items:center;gap:14px;padding:14px;text-decoration:none;color:inherit;margin-bottom:6px;transition:transform .15s}
.social:active{transform:scale(.98)}
.social .go{margin-left:auto;color:var(--muted);font-size:22px;transition:transform .2s}
.social:hover .go{transform:translateX(4px)}
.foot{text-align:center;color:var(--muted);font-size:12px;margin-top:26px;letter-spacing:.04em}
a:focus-visible,button:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid #fff;outline-offset:2px}
/* message sheet */
.sheet{position:fixed;inset:0;z-index:20;display:flex;align-items:flex-end;justify-content:center;visibility:hidden}
.sheet.open{visibility:visible}
.back{position:absolute;inset:0;background:rgba(0,0,0,.65);opacity:0;transition:opacity .3s;backdrop-filter:blur(4px)}
.sheet.open .back{opacity:1}
.box{position:relative;width:100%;max-width:480px;background:#111;border:1px solid var(--line);border-radius:22px 22px 0 0;padding:22px 20px calc(22px + env(safe-area-inset-bottom,0px));transform:translateY(100%);transition:transform .35s cubic-bezier(.2,.8,.2,1)}
.sheet.open .box{transform:none}
.box h3{font-family:Montserrat,system-ui,-apple-system,"Segoe UI",sans-serif;font-size:21px;font-weight:700;margin-bottom:14px}
.box label{display:block;font-size:12.5px;color:var(--muted);margin:12px 0 6px}
.box input,.box textarea{width:100%;background:#0a0a0a;border:1px solid var(--line);border-radius:10px;color:#fff;font:16px Montserrat,system-ui,sans-serif;padding:12px}
.box textarea{min-height:110px;resize:vertical}
.btns{display:flex;gap:10px;margin-top:18px}
.btns button{flex:1;padding:14px;border-radius:12px;font:600 15px Montserrat,system-ui,sans-serif;cursor:pointer;border:1px solid var(--line);background:transparent;color:#fff}
.btns .send{background:#fff;color:#000;border-color:#fff}
.toast{position:fixed;left:50%;bottom:28px;transform:translate(-50%,30px);background:#fff;color:#000;padding:11px 18px;border-radius:30px;font-size:14px;font-weight:600;opacity:0;pointer-events:none;transition:all .3s;z-index:30}
.toast.show{opacity:1;transform:translate(-50%,0)}
@media (max-width:380px){.txt span{font-size:13.5px}.txt span.sm{font-size:11.5px;letter-spacing:-.015em}.main{gap:12px}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}.js .rise{opacity:1;transform:none}}
</style>

<script>
(function () {
  document.documentElement.classList.add("js");
  var $ = function (s) { return document.querySelector(s); };
  var all = function (s) { return [].slice.call(document.querySelectorAll(s)); };

  // staggered rows inside panels
  all(".panel").forEach(function (p) {
    all(".panel").length;
    [].slice.call(p.querySelectorAll(".row, .social")).forEach(function (r, i) { r.dataset.d = 120 + i * 90; });
  });
  var io = "IntersectionObserver" in window ? new IntersectionObserver(function (es) {
    es.forEach(function (e) { if (e.isIntersecting) { e.target.style.setProperty("--d", (e.target.dataset.d || 0) + "ms"); e.target.classList.add("in"); io.unobserve(e.target); } });
  }, { threshold: 0.1 }) : null;
  all(".rise").forEach(function (el) { if (io) io.observe(el); else el.classList.add("in"); });

  // cover logo fades away as you scroll
  var cbg = $("#cbg"), tick = false;
  addEventListener("scroll", function () {
    if (tick) return; tick = true;
    requestAnimationFrame(function () { cbg.style.setProperty("--py", -Math.min(scrollY * 0.2, 40) + "px"); cbg.style.setProperty("--op", Math.max(0, 1 - scrollY / 220)); tick = false; });
  }, { passive: true });

  // pointer spotlight
  document.addEventListener("pointermove", function (e) {
    var t = e.target.closest && e.target.closest(".glass, .row");
    if (!t) return;
    var r = t.getBoundingClientRect();
    t.style.setProperty("--mx", (e.clientX - r.left) + "px");
    t.style.setProperty("--my", (e.clientY - r.top) + "px");
  });

  // toast + copy
  var toast = $("#toast"), tt;
  function say(msg) { toast.textContent = msg; toast.classList.add("show"); clearTimeout(tt); tt = setTimeout(function () { toast.classList.remove("show"); }, 1800); }
  function copy(text, msg) {
    function fallback() { var a = document.createElement("textarea"); a.value = text; document.body.appendChild(a); a.select(); try { document.execCommand("copy"); say(msg); } catch (x) { say("Copy not available"); } a.remove(); }
    if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(text).then(function () { say(msg); }, fallback); else fallback();
  }
  all(".copy").forEach(function (b) { b.addEventListener("click", function () { copy(b.dataset.copy, "Copied"); }); });

  // share
  $("#share").addEventListener("click", function () {
    if (navigator.share) navigator.share({ title: document.title, url: location.href }).catch(function () {});
    else copy(location.href, "Link copied");
  });

  // message sheet
  var sheet = $("#sheet");
  function open() { sheet.classList.add("open"); document.body.style.overflow = "hidden"; setTimeout(function () { $("#n").focus(); }, 350); }
  function close() { sheet.classList.remove("open"); document.body.style.overflow = ""; }
  $("#openMsg").addEventListener("click", open);
  $("#cancel").addEventListener("click", close);
  $("#back").addEventListener("click", close);
  addEventListener("keydown", function (e) { if (e.key === "Escape") close(); });
  $("#send").addEventListener("click", function () {
    var n = $("#n").value.trim(), em = $("#e").value.trim(), m = $("#m").value.trim();
    if (!m) { say("Please type a message"); $("#m").focus(); return; }
    var body = m + "\n\n— " + (n || "") + (em ? " (" + em + ")" : "");
    location.href = "mailto:shane.angulo@bluugallery.com?subject=" + encodeURIComponent("Message from your digital card") + "&body=" + encodeURIComponent(body);
    close();
  });
})();
</script>
</body>
</html>
